name: Auto tag
# After CI passes on main, derive the next semantic version from conventional commits and release it.
#   feat: → minor   fix:/perf: → patch   type!: or "BREAKING CHANGE" → major (minor while still 0.x)
# Nothing is released unless a feat/fix/perf commit touched files that ship in the binary.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency: auto-tag

jobs:
  tag:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Compute next version
        id: next
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha }}"
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$sha" 2>/dev/null || true)
          if [ -n "$last" ] && [ "$(git rev-parse "$last^{commit}")" = "$sha" ]; then echo "Already tagged $last."; exit 0; fi
          range="${last:+$last..}$sha"
          base="${last:-v0.0.0}"

          files=$(git diff --name-only "${last:-$(git hash-object -t tree /dev/null)}" "$sha")
          echo "$files" | grep -Eq '(\.go|go\.mod|go\.sum|app\.html|subjects\.js|install\.(sh|ps1))$|^\.github/workflows/release\.yml$' \
            || { echo "No shipped files changed since $base; not releasing."; exit 0; }

          subjects=$(git log --format=%s "$range")
          if echo "$subjects" | grep -Eq '^[a-z]+(\([^)]*\))?!:' || git log --format=%B "$range" | grep -q '^BREAKING CHANGE'; then bump=major
          elif echo "$subjects" | grep -Eq '^feat(\([^)]*\))?:'; then bump=minor
          elif echo "$subjects" | grep -Eq '^(fix|perf)(\([^)]*\))?:'; then bump=patch
          else echo "No feat/fix/perf commits since $base; not releasing."; exit 0; fi

          IFS=. read -r major minor patch <<<"${base#v}"
          if [ "$major" = 0 ] && [ "$bump" = major ]; then bump=minor; fi
          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          echo "version=v$major.$minor.$patch" >> "$GITHUB_OUTPUT"
      - name: Tag and release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.next.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "$v" "${{ github.event.workflow_run.head_sha }}"
          git push origin "$v"
          # Tags pushed with GITHUB_TOKEN don't trigger other workflows, so start the release explicitly.
          gh workflow run release.yml -f version="$v"
