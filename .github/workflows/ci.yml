name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && go vet -tags e2e ./...
      - name: Subject packs are valid
        run: go run . validate
      - name: subjects.js matches data/*.js
        run: |
          go run . manifest
          git diff --exit-code subjects.js || { echo "::error::subjects.js is stale — run 'go run . manifest' and commit it"; exit 1; }
      - run: go test ./...
      - name: Cross-compile every release target
        run: |
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null . || exit 1
          done

  e2e:
    # Builds the real binary and drives it like a user: signed subject sync (and rejection of tampered content),
    # offline serving, the page rendered in headless Chrome, the one-command installer, and the AI helper
    # (private Ollama install → model pull → chat through the same-origin proxy).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Linux prerequisites (zstd for Ollama's .tar.zst release)
        if: runner.os == 'Linux'
        run: command -v zstd || sudo apt-get install -y zstd
      - name: End-to-end tests
        env:
          E2E_AI: '1'
          E2E_REQUIRE_BROWSER: '1'
        run: go test -tags e2e -count=1 -v -timeout 50m ./...
