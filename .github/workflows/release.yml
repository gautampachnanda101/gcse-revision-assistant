name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing version tag to release (for example v1.2.3)'
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}
  TAP_REPO: gautampachnanda101/homebrew-tap
  SCOOP_BUCKET_REPO: gautampachnanda101/scoop-bucket

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::Invalid version tag: $VERSION"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Refuse to release without a content signing key
        run: |
          if grep -q 'REPLACE_WITH_PUBLIC_KEY' signing.go; then echo "::error::run scripts/setup-signing.sh first"; exit 1; fi
      - run: go test ./...
      - name: Build
        run: |
          mkdir -p dist archives
          for t in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION} -X main.repo=${GITHUB_REPOSITORY}" \
              -o "dist/gcse-revision-$os-$arch$ext" .

            # Archives for Homebrew and Scoop: gcse-revision_<OS>_<arch>.{tar.gz,zip}
            case "$os" in darwin) osl=Darwin ;; linux) osl=Linux ;; windows) osl=Windows ;; esac
            case "$arch" in amd64) archl=x86_64 ;; arm64) archl=arm64 ;; esac
            stage=$(mktemp -d)
            cp "dist/gcse-revision-$os-$arch$ext" "$stage/gcse-revision$ext"
            if [ "$os" = windows ]; then
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/archives/gcse-revision_${osl}_${archl}.zip" "gcse-revision$ext")
            else
              tar -C "$stage" -czf "archives/gcse-revision_${osl}_${archl}.tar.gz" gcse-revision
            fi
          done
          (cd dist && sha256sum gcse-revision-* > checksums.txt)
          (cd archives && sha256sum gcse-revision_* > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/* --clobber
          else
            gh release create "$VERSION" dist/* --title "$VERSION" --generate-notes --verify-tag
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: archives
          path: archives/*

  publish-packages:
    # Homebrew formula and Scoop manifest, same layout as kb-genie: archives live in a gcse-revision-<tag>
    # release on the tap repo, and the formula/manifest point at them.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: archives
          path: archives
      - name: Publish archives to the tap release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "$GH_TOKEN" ] || { echo "::error::HOMEBREW_TAP_GITHUB_TOKEN secret missing (needs contents:write on the tap and scoop-bucket repos)"; exit 1; }
          tap_tag="gcse-revision-${VERSION}"
          gh release view "$tap_tag" --repo "$TAP_REPO" >/dev/null 2>&1 || \
            gh release create "$tap_tag" --repo "$TAP_REPO" --title "gcse-revision $VERSION" --notes "Release assets for gcse-revision $VERSION"
          gh release upload "$tap_tag" --repo "$TAP_REPO" --clobber archives/*
      - name: Generate Homebrew formula and Scoop manifest
        run: |
          set -euo pipefail
          bare="${VERSION#v}"
          base="https://github.com/${TAP_REPO}/releases/download/gcse-revision-${VERSION}"
          sum() { awk -v f="$1" '$2 == f {print $1}' archives/checksums.txt; }
          d_x=$(sum gcse-revision_Darwin_x86_64.tar.gz); d_a=$(sum gcse-revision_Darwin_arm64.tar.gz)
          l_x=$(sum gcse-revision_Linux_x86_64.tar.gz);  l_a=$(sum gcse-revision_Linux_arm64.tar.gz)
          w_x=$(sum gcse-revision_Windows_x86_64.zip);   w_a=$(sum gcse-revision_Windows_arm64.zip)
          for v in "$d_x" "$d_a" "$l_x" "$l_a" "$w_x" "$w_a"; do [ -n "$v" ] || { echo "Missing checksum entry" >&2; exit 1; }; done

          mkdir -p out
          cat >out/gcse-revision.rb <<EOF
          # typed: false
          # frozen_string_literal: true

          class GcseRevision < Formula
            desc "Offline GCSE revision app with a built-in AI helper"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${bare}"

            on_macos do
              on_intel do
                url "${base}/gcse-revision_Darwin_x86_64.tar.gz"
                sha256 "${d_x}"
              end
              on_arm do
                url "${base}/gcse-revision_Darwin_arm64.tar.gz"
                sha256 "${d_a}"
              end
            end

            on_linux do
              on_intel do
                url "${base}/gcse-revision_Linux_x86_64.tar.gz"
                sha256 "${l_x}"
              end
              on_arm do
                url "${base}/gcse-revision_Linux_arm64.tar.gz"
                sha256 "${l_a}"
              end
            end

            def install
              bin.install "gcse-revision"
            end

            def caveats
              <<~EOS
                Start the per-user background service with:
                  #{bin}/gcse-revision service install

                The service opens at http://gcse-revision.localhost:8765/ and checks for upgrades automatically.
              EOS
            end

            test do
              assert_match "${bare}", shell_output("#{bin}/gcse-revision version")
            end
          end
          EOF

          cat >out/gcse-revision.json <<EOF
          {
            "version": "${bare}",
            "description": "Offline GCSE revision app with a built-in AI helper",
            "homepage": "https://github.com/${GITHUB_REPOSITORY}",
            "architecture": {
              "64bit": { "url": "${base}/gcse-revision_Windows_x86_64.zip", "hash": "${w_x}", "bin": "gcse-revision.exe" },
              "arm64": { "url": "${base}/gcse-revision_Windows_arm64.zip", "hash": "${w_a}", "bin": "gcse-revision.exe" }
            }
          }
          EOF
      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: tap
      - name: Checkout scoop bucket
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SCOOP_BUCKET_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: scoop-bucket
      - name: Commit and push
        run: |
          set -euo pipefail
          push() { # <repo dir> <file> <dest dir>
            mkdir -p "$1/$3"; cp "$2" "$1/$3/"
            (cd "$1"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add "$3"
              git diff --cached --quiet && { echo "No changes in $1."; exit 0; }
              git commit -m "chore: update gcse-revision ${VERSION}"
              git push)
          }
          push tap out/gcse-revision.rb Formula
          push scoop-bucket out/gcse-revision.json bucket

  smoke:
    # The real user journey against the real release: one-command install, then fetch signed content from GitHub.
    needs: [release, publish-packages]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install (macOS/Linux)
        if: runner.os != 'Windows'
        env:
          GCSE_REVISION_NO_RUN: '1'
          GCSE_REVISION_BIN_DIR: ${{ runner.temp }}/bin
          GCSE_REVISION_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${VERSION}/install.sh" | sh
          "$GCSE_REVISION_BIN_DIR/gcse-revision" version | grep -F "${VERSION}"
          "$GCSE_REVISION_BIN_DIR/gcse-revision" update
      - name: Smoke test background service (macOS)
        if: runner.os == 'macOS'
        run: |
          "$RUNNER_TEMP/bin/gcse-revision" service install
          for _ in $(seq 1 30); do
            curl -fsS http://gcse-revision.localhost:8765/api/info >/dev/null && break
            sleep 1
          done
          "$RUNNER_TEMP/bin/gcse-revision" service status | grep -F running
          "$RUNNER_TEMP/bin/gcse-revision" service logs
          curl -fsS http://gcse-revision.localhost:8765/ | grep -F 'GCSE'
          "$RUNNER_TEMP/bin/gcse-revision" service uninstall
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GCSE_REVISION_NO_RUN: '1'
          GCSE_REVISION_NO_PATH: '1'
          GCSE_REVISION_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ env.VERSION }}
        run: |
          irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:VERSION/install.ps1" | iex
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\gcse-revision\gcse-revision.exe'
          $v = & $exe version; if ($v -notmatch [regex]::Escape($env:VERSION)) { throw "wrong version: $v" }
          & $exe update; if ($LASTEXITCODE -ne 0) { throw 'update failed' }
      - name: Smoke test background service and Scoop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\gcse-revision\gcse-revision.exe'
          & $exe service install
          if ($LASTEXITCODE -ne 0) { throw 'service install failed' }
          $healthy = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { (Invoke-WebRequest -UseBasicParsing 'http://127.0.0.1:8765/api/info').Content | Out-Null; $healthy = $true; break }
            catch { Start-Sleep -Seconds 1 }
          }
          if (-not $healthy) { throw 'service health check failed' }
          $status = & $exe service status
          if ($status -notmatch 'running') { throw "service did not start: $status" }
          & $exe service logs
          & $exe service uninstall
          Set-ExecutionPolicy Bypass -Scope Process -Force
          Invoke-RestMethod 'https://get.scoop.sh' | Invoke-Expression
          scoop bucket add gcse https://github.com/${env:SCOOP_BUCKET_REPO}
          scoop install gcse/gcse-revision
          $scoopExe = Join-Path (scoop prefix gcse-revision) 'gcse-revision.exe'
          $version = & $scoopExe version
          if ($version -notmatch [regex]::Escape($env:VERSION)) { throw "wrong Scoop version: $version" }
      - name: Smoke test Homebrew formula
        if: runner.os == 'macOS'
        run: |
          brew update
          formula="${TAP_REPO/homebrew-tap/tap}/gcse-revision"
          brew install --formula "$formula"
          brew test "$formula"
